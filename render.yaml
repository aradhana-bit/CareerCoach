services:
  - type: web
    name: careercoach-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_DAYS
        value: "7"
      - key: CLIENT_URL
        sync: false
